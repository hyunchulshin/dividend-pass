name: Daily Dividend Stocks Sync

on:
  schedule:
    # 매일 07:00 KST (전일 22:00 UTC) 실행
    - cron: '0 22 * * *'
  workflow_dispatch: # 수동 실행 지원

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run dividend stocks collector (collector.py)
        run: |
          python scripts/collector.py
          python scripts/fetch_dividend_stocks.py

      - name: Validate dataset integrity (Phase 1 QA)
        run: |
          python scripts/validate_phase1.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/dividend_stocks_500.json public/dividend_stocks_500.json
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "chore(data): auto-sync dividend stocks 500 dataset [skip ci]"
            git push
          fi
